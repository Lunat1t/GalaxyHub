services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: galaxy
      POSTGRES_PASSWORD: galaxy
      POSTGRES_DB: galaxy_hub
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galaxy -d galaxy_hub"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    volumes:
      - galaxy-postgres:/var/lib/postgresql/data
volumes:
  galaxy-postgres:
